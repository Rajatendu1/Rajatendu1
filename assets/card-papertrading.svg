<svg xmlns="http://www.w3.org/2000/svg" width="580" height="270" viewBox="0 0 580 270" role="img" aria-labelledby="t d">
<title id="t">paper-trading-india - paper-only trading experiments</title><desc id="d">A public paper-trading experiment tracker for Indian equities: logged decisions, an itemized cost model and an independent reproduction script for every published number.</desc>
