<text x="32" y="132" font-size="12" fill="#a7b8ce">Delegation tokens for AI agents: RFC 8693 token exchange.</text>
<text x="32" y="243" font-size="12" fill="#a5b5ff" letter-spacing="1">EXPLORE PROJECT</text>
