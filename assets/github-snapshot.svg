<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="GitHub snapshot">
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#163047" stroke-opacity=".3"/></pattern>
<radialGradient id="halo"><stop stop-color="#233759"/><stop offset="1" stop-color="#080e19"/></radialGradient>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace}
.signal{stroke-dasharray:3 13;animation:signal 5s linear infinite}
.route{stroke-dasharray:8 75;animation:route 3s linear infinite}
.gate{animation:gate 5s ease-in-out infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
.orbit{animation:turn 32s linear infinite;transform-box:fill-box;transform-origin:center}
.satellite{animation:turn 9s linear infinite;transform-origin:0 0}
.satellite.reverse{animation-direction:reverse;animation-duration:13s}
.sonar{animation:sonar 4s ease-out infinite;transform-origin:0 0}
.glowpulse{animation:glowpulse 5s ease-in-out infinite}
.flicker{animation:flicker 7s linear infinite}
.draw{stroke-dasharray:900;animation:draw 9s ease-in-out infinite}
@keyframes signal{to{stroke-dashoffset:-160}}
@keyframes route{to{stroke-dashoffset:-166}}
@keyframes gate{0%,20%,85%,100%{opacity:.2}40%,65%{opacity:1}}
@keyframes pulse{50%{opacity:.3}}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes sonar{0%{transform:scale(.4);opacity:0}20%{opacity:.7}100%{transform:scale(1.7);opacity:0}}
@keyframes glowpulse{50%{opacity:.55}}
@keyframes flicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.6}94%{opacity:1}96%{opacity:.75}97%{opacity:1}}
@keyframes draw{0%{stroke-dashoffset:900}60%,100%{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="200" rx="14" fill="url(#halo)"/>
<rect width="1200" height="200" rx="14" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="198" rx="13" fill="none" stroke="#26364a"/>
<text x="36" y="40" font-size="11" fill="#9de8d0" letter-spacing="3">GITHUB / SNAPSHOT</text>
<text x="1164" y="40" font-size="10" fill="#5b7186" text-anchor="end" letter-spacing="2">SOURCE: GITHUB PUBLIC API</text>
<g font-family="ui-monospace,monospace">
<g transform="translate(36 78)">
<text font-size="34" fill="#edf3ff">14</text><text y="30" font-size="11" fill="#a7b8ce" letter-spacing="2">FOLLOWERS</text>
<path d="M0 44H220" stroke="#26364a"/><path class="signal" d="M0 44H220" stroke="#9de8d0"/>
</g>
<g transform="translate(316 78)">
<text font-size="34" fill="#edf3ff">41</text><text y="30" font-size="11" fill="#a7b8ce" letter-spacing="2">PUBLIC REPOS</text>
<path d="M0 44H220" stroke="#26364a"/><path class="signal" d="M0 44H220" stroke="#7cc7ff"/>
</g>
<g transform="translate(596 78)">
<text font-size="34" fill="#edf3ff">20</text><text y="30" font-size="11" fill="#a7b8ce" letter-spacing="2">OWNED / NON-FORK</text>
<path d="M0 44H220" stroke="#26364a"/><path class="signal" d="M0 44H220" stroke="#a5b5ff"/>
</g>
<g transform="translate(876 78)">
<text font-size="34" fill="#edf3ff">17</text><text y="30" font-size="11" fill="#a7b8ce" letter-spacing="2">STARS EARNED</text>
<path d="M0 44H220" stroke="#26364a"/><path class="signal" d="M0 44H220" stroke="#f0a35e"/>
</g>
</g>
<text x="36" y="182" font-size="10" fill="#5b7186" letter-spacing="2">VERIFIED 12 NOV 2026 · COUNTS CHANGE AS THE ACCOUNT GROWS</text>
<circle class="pulse" cx="1164" cy="176" r="3.5" fill="#9de8d0"/>
</svg>
